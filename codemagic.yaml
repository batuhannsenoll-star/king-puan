# King & Rıfkı Skor Tablosu — Codemagic build ayarları
# Android: imzalı .aab üretir (ilk yüklemeyi Play Console'a elle yap).
# iOS: imzalı .ipa üretir ve TestFlight'a gönderir.
workflows:
  android-release:
    name: Android (Google Play)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      android_signing:
        - king_keystore            # Codemagic > Team > Code signing identities > Android keystores'taki referans adı
      node: 22
      java: 21
    scripts:
      - name: Paketleri kur
        script: npm ci
      - name: Capacitor sync
        script: npx cap sync android
      - name: SDK yolu
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: AAB derle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    # İlk sürümü elle yükledikten sonra otomatik yükleme istersen aç:
    # environment.groups'a "google_play" ekle (GCLOUD_SERVICE_ACCOUNT_CREDENTIALS değişkeni)
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal

  ios-release:
    name: iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: king_asc_key   # Codemagic > Team > Integrations > App Store Connect'teki anahtar adı
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.batuhansenol.kingpuan
      node: 22
      xcode: latest
    scripts:
      - name: Paketleri kur
        script: npm ci
      - name: Capacitor sync
        script: npx cap sync ios
      - name: İmzalama profillerini uygula
        script: xcode-project use-profiles
      - name: Build numarası
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: IPA derle
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
